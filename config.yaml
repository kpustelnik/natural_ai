# Wszystkie parametry projektu w jednym miejscu.
# Eksperymenty w experiments/configs/*.yaml nadpisują wybrane klucze.
# Jednostki: metry i sekundy. Formaty plików: docs/data_contracts.md

seed: 42

paths:
  raw: data/raw
  processed: data/processed
  sample: data/sample
  campus: data/campus            # ręcznie modelowane budynki (z --sample: data/sample/campus)
  results: experiments/results
  web_data: web/public/data

campus:
  # obszar pobierany z OSM (lon/lat, WGS84): kampus AGH + Miasteczko Studenckie + otoczenie
  bbox: { west: 19.8975, south: 50.0625, east: 19.9265, north: 50.0730 }
  agh_relation: 3830877      # amenity=university "Akademia Górniczo-Hutnicza"
  # początek układu sceny three.js (x = wschód, y = góra, z = -północ)
  web_origin: { lon: 19.915, lat: 50.067, z: 200.0 }
  floor_height_m: 3.5        # LOD1: wysokość = piętra * floor_height_m
  default_levels: 3          # LOD1: gdy OSM nie ma building:levels

osm:
  overpass_urls:
    - https://overpass-api.de/api/interpreter
    - https://overpass.private.coffee/api/interpreter
    - https://maps.mail.ru/osm/tools/overpass/api/interpreter
  retries: 6
  timeout_s: 180
  user_agent: "metro-agh-student-project/0.1 (AGH course project)"
  entrance_snap_m: 1.5       # wejście należy do budynku, jeśli leży bliżej niż tyle od obrysu
  footprint_simplify_m: 0.2  # upraszczanie obrysów przy bootstrapie YAML

usos:
  # publiczne API USOS (budynki, sale, pojemności) + publiczny katalog USOSweb (plany sal,
  # grupy przedmiotów = kohorty, liczba osób w grupach i limity); bez logowania i klucza API
  term: "26/27-Z"            # id cyklu w USOS AGH (services/terms/terms_index)
  scope: all                 # all = cały USOS (wszystkie wydziały, kierunki, sale, daty
                             # spotkań -> usos/all/); campus = tylko sale budynków kampusu
  delay_s: 0.4               # odstęp między zapytaniami do USOS
  cache_days:                # po ilu dniach strona z cache jest pobierana ponownie
    web/unit: 3              # grupy zajęć: liczba zapisanych zmienia się do końca zapisów
    web/course: 30           # strony przedmiotów: kohorty, jednostki cyklu
    api/tt: 7                # daty spotkań (przesunięcia zajęć)
    api: 90                  # budynki, sale, pojemności
    web/catalogue: 30        # listy grup przedmiotów i ich przedmiotów
                             # plany sal mają osobny folder na każdy tydzień (--week)

population:
  n_students: auto           # auto = suma kohort z USOS; liczba = przeskalowanie kohort do niej
  dorm_share: auto           # auto = łóżka w akademikach / studenci; reszta przyjeżdża na
                             # przystanki z campus.yaml (wg weight)
  dorm_beds: 7000            # miejsca dla studentów AGH na Miasteczku (z ponad 8000 łącznie)
  m2_per_bed: 25             # gdy dorm_beds = 0: łóżko na tyle m² powierzchni kondygnacji

transit:
  feeds:                     # GTFS ZTP Kraków (otwarte dane)
    bus: https://gtfs.ztp.krakow.pl/GTFS_KRK_A.zip
    tram: https://gtfs.ztp.krakow.pl/GTFS_KRK_T.zip
  date: auto                 # dzień rozkładu (YYYY-MM-DD); auto = najbliższy wtorek
  peak_hours: [7, 10]        # okno szczytu porannego dla wag przystanków
  margin_m: 150              # przystanki do tylu metrów poza campus.bbox też się liczą
  seats: { bus: 90, tram: 180 }   # miejsc w pojeździe (waga przystanku)

demand:
  week: auto                 # tydzień popytu: auto = najruchliwszy tydzień kalendarza z
                             # usos/all/meetings.csv, YYYY-MM-DD = ten poniedziałek,
                             # typical = typowy tydzień z timetable.csv (wg week_parity)
  week_parity: odd           # tylko dla week: typical: odd | even
  arrival_buffer_s: 300      # student chce być 5 min przed zajęciami
  max_break_s: 10800         # przerwa > 3 h: wraca do domu (akademik) / zostaje (przystanek)

time_model:
  walk_speed_mps: 1.3        # ~4.7 km/h, poziomo
  stairs_up_mps: 0.35        # prędkość pionowa na schodach w górę
  stairs_down_mps: 0.45      # prędkość pionowa na schodach w dół
  door_s: 3                  # przejście przez drzwi sali / wejście do budynku
  outdoor_steps_factor: 1.5  # schody z OSM (bez wysokości): czas = długość / walk_speed × factor

network:
  corridor_node_step_m: 5.0  # węzeł grafu co tyle metrów wzdłuż korytarza
  link_warn_m: 40.0          # wejście / przystanek dalej od chodnika z OSM -> uwaga w issues

metro:
  n_stations: 5              # k
  topology: line             # line | loop
  candidates: all            # all | lista kodów budynków, np. [A-0, B-1, D-17]
  station_depth_m: 15        # szyb = dodatkowe schody pod głównym wejściem
  speed_mps: 10.0            # ~36 km/h
  dwell_s: 30                # postój na każdej stacji pośredniej
  headway_s: 180             # co ile odjeżdża pociąg; ACO przyjmuje czekanie = headway / 2
  tunnel_penalty_per_km: 0.0 # kara: taki ułamek czasu bez metra za każdy km tunelu (0 = brak)
  service: { start: "07:00", end: "21:00" }

optimize:
  algorithm: mmas            # mmas | acs | random | greedy | brute_force
  brute_force_max_lines: 200000  # brute force tylko na małych instancjach
  local_search: true         # dopracowanie linii (zamiana / przestawienie stacji), wszystkie
                             # algorytmy poza brute force; z nią optimum znajdowane niezawodnie
  max_evaluations: null      # wspólny budżet różnych linii (null = bez limitu: wszystkie iteracje;
                             # z local_search ocen jest wtedy wielokrotnie więcej)

aco:                         # MMAS i ACS; random bierze n_ants × n_iterations losowych linii
  n_ants: 50
  n_iterations: 200
  alpha: 1.0                 # waga feromonu
  beta: 1.0                  # waga heurystyki (ablacja: 1 > 3 > 5, heurystyka popytu myli)
  rho: 0.1                   # parowanie
  heuristic: demand_distance # η: demand_distance | distance | demand | none (docs/aco.md §3)
  tau_min_ratio: 0.01        # tylko MMAS: tau_min = tau_max * ratio
  q0: 0.5                    # tylko ACS: szansa wyboru najlepszej następnej stacji (0.9 z
                             # literatury tu powtarza ciągle te same linie)
  xi: 0.1                    # tylko ACS: lokalne parowanie (ślad wraca do tau0)
  trace:                     # zapis mrówek do trace.npz (analiza + animacja)
    every: 5                 # co która iteracja
    max_ants: 50             # ile mrówek z iteracji

walk_aco:                    # ACO poziom 1: mrówki rozkładają ruch pieszy szczytu z tłokiem
  # popyt: piesze przejścia scenariusza bez metra (simulation/no_metro/legs.parquet)
  # wychodzące w oknie [window_start, +window_s) czasu tygodnia (pon. 00:00 = 0)
  window_start_wt: 207000    # środa 9:30: najliczniejsze 15 min tygodnia (5 381 przejść)
  window_s: 900
  period_s: 300              # okres przepływu: 81 % wychodzi w 1. minucie, mediana
                             # przejścia 4,6 min -> fala mija odcinek w ok. 5 min
  capacity_ped_min_m: 75     # przepustowość chodnika (FHWA-RD-98-107: 75 os./min/m)
  stairs_capacity_ped_min_m: 50  # schody: założenie (ok. 2/3 chodnika)
  bpr_a: 0.73                # t = t0 (1 + a (x/C)^b); a: 1,3 m/s -> 0,75 m/s przy x = C
  bpr_b: 4.0                 # wykładnik BPR
  widths_m:                  # szerokość użyteczna wg typu (OSM nie ma tagu width)
    footway: 2.0
    path: 1.5
    steps: 2.0
    service: 3.0
    residential: 3.0
    living_street: 4.0
    pedestrian: 6.0
    track: 2.5
    link: 3.0
    entrance: 1.8
    door: 1.8
    corridor: 2.5
    passage: 3.0
    stairs: 2.0
  n_ants: 8                  # mrówek na parę (skąd, dokąd) w iteracji
  n_iterations: 60
  alpha: 1.0                 # waga feromonu
  beta: 1.0                  # waga heurystyki: exp(-beta * nadłożony czas / detour_scale_s)
  detour_scale_s: 20.0
  rho: 0.1                   # parowanie
  tau_min: 0.05              # ograniczenia feromonu (jak w MMAS)
  tau_max: 5.0
  trace: { every: 2, max_ants: 150 }

simulation:
  transit: true             # autobusy i tramwaje z GTFS (transit/trips.parquet) w obu
                             # scenariuszach i w czasie "bez metra" instancji ACO
  weekdays: [1, 2, 3, 4, 5]
