# One-factor-at-a-time vs config.yaml ACO defaults (plus the defaults: block below).
# Values equal to the effective baseline are skipped so they do not duplicate `base`.
#
#   uv run scripts/run_experiments.py --config experiments/configs/aco_ablation.yaml --dry-run
#   uv run scripts/run_experiments.py --config experiments/configs/aco_ablation.yaml --processed data/processed/fake

name: aco_ablation
description: Ablation of MMAS α, β, ρ (and ant / iteration budget)
mode: ablation
processed: data/processed/fake
seeds: [42, 43, 44]
save_trace: false

# Keep the study cheap; raise these toward config.yaml for the paper runs.
defaults:
  aco:
    n_ants: 20
    n_iterations: 40
    trace: { every: 10, max_ants: 20 }

sweep:
  aco.alpha: [0.5, 1.0, 2.0]
  aco.beta: [1.0, 3.0, 5.0]
  aco.rho: [0.05, 0.1, 0.2]
  aco.n_ants: [10, 20, 50]
  aco.n_iterations: [20, 40, 100]
