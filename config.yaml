# Wszystkie parametry projektu w jednym miejscu.
# Eksperymenty w experiments/configs/*.yaml nadpisują wybrane klucze.

seed: 42

paths:
  raw: data/raw
  processed: data/processed
  sample: data/sample
  results: experiments/results
  web_data: web/data

campus:
  # obszar kampusu AGH (lon/lat, WGS84) - do doprecyzowania
  bbox: { west: 19.900, south: 50.062, east: 19.930, north: 50.072 }
  network_type: walk
  floor_height_m: 3.5        # wysokość budynku = piętra * floor_height_m
  default_levels: 3          # gdy OSM nie ma building:levels

usos:
  # plan B, gdy API niedostępne: "ical"
  source: api
  term: "2026Z"

time_model:
  walk_speed_mps: 1.3        # ~4.7 km/h
  metro_speed_mps: 10.0      # ~36 km/h
  boarding_penalty_s: 120    # zejście na peron + średnie czekanie
  alighting_penalty_s: 60

metro:
  n_stations: 5              # k

aco:
  variant: mmas              # mmas | acs
  n_ants: 50
  n_iterations: 200
  alpha: 1.0                 # waga feromonu
  beta: 3.0                  # waga heurystyki
  rho: 0.1                   # parowanie
  q0: 0.9                    # tylko ACS: eksploatacja vs eksploracja
  tau_min_ratio: 0.01        # tylko MMAS: tau_min = tau_max * ratio

simulation:
  weekday: 1                 # 1 = poniedziałek
  start: "07:30"
  end: "20:00"
  agents_per_group: 5        # liczba śladów na grupę w wizualizacji
